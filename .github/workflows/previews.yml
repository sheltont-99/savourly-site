name: Make card previews from Fine Dining PDFs

# When a Fine Dining print PDF is added or replaced in images/, render its first page
# to images/<ID>-preview.jpg and point products.json at it.
on:
  push:
    branches: [main]
    paths: ['images/*-fine-dining.pdf']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install --quiet pillow
      - name: Make previews
        # Git checkouts don't keep file dates, so rebuild previews for the PDFs changed in this push.
        run: |
          for f in $(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'images/*-fine-dining.pdf' 2>/dev/null); do touch "$f"; done
          python3 tools/make_previews.py $([ "${{ github.event_name }}" = "workflow_dispatch" ] && echo --force)
      - name: Save them
        run: |
          git config user.name "savourly-previews"
          git config user.email "actions@users.noreply.github.com"
          git add images/*-preview.jpg products.json
          git diff --cached --quiet || (git commit -m "Update card previews from Fine Dining PDFs" && git push)
